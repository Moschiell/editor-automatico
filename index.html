<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Automático V7.6</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Editor Automático</h1><p>Template • legenda • marca d'água • processamento no servidor</p></header><section class="grid"><div class="panel previewPanel"><h2>Prévia</h2><div class="phone"><video id="preview" controls playsinline muted></video><div id="previewTitle"></div><div id="previewCaption"></div><div id="previewHandle"></div><img id="previewWatermark"></div><div id="info">Nenhum vídeo selecionado.</div><input id="videos" type="file" accept="video/*" multiple></div><div class="panel"><h2>Template</h2><select id="template"><option value="news-card">Notícias — cartão</option><option value="clean">Limpo</option><option value="headline">Manchete</option></select><label>Título<input id="headline" placeholder="Ex.: NOTÍCIA DE HOJE"></label><label>Legenda<textarea id="caption" rows="4" placeholder="Digite a legenda que ficará no vídeo"></textarea></label><label>@ usuário<input id="handle" placeholder="@seuperfil"></label><label>Marca d'água <input id="watermark" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Tamanho da marca <input id="logoSize" type="range" min="40" max="260" value="120"><span id="logoSizeValue">120</span></label><label class="check"><input id="mirror" type="checkbox"> Espelhar vídeo</label><label>Velocidade<select id="speed"><option value="1">1.00x</option><option value="1.03">1.03x</option><option value="1.05">1.05x</option></select></label><button id="generate" type="button">GERAR VÍDEOS</button><p id="status">Aguardando.</p><progress id="progress" value="0" max="100"></progress></div></section><section class="panel"><h2>Resultados</h2><div id="results"></div></section></main><script src="app.js?v=7.6"></script></body></html>
