<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Automático</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Editor Automático</h1><p>Renderização no servidor • até 5 vídeos</p><section><video id="preview" controls playsinline muted></video><input id="videos" type="file" accept="video/*" multiple><div id="info">Nenhum vídeo selecionado.</div></section><section><input id="headline" placeholder="Título"><input id="handle" placeholder="@usuário"><label><input id="mirror" type="checkbox"> Espelhar</label><select id="speed"><option value="1">1.00x</option><option value="1.03">1.03x</option><option value="1.05">1.05x</option></select><button id="generate">GERAR VÍDEOS</button><p id="status">Aguardando.</p><progress id="progress" value="0" max="100"></progress></section><section><h2>Resultados</h2><div id="results"></div></section></main><script src="app.js"></script></body></html>
